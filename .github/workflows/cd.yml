name: CD

# Publica a imagem do front no GHCR a cada tag release-*, depois de provar que ela sobe e responde.
on:
  push:
    tags:
      - 'release-*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image name from git tag
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/4frames-web:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=build-web

      # O mesmo smoke do CI, antes do push: uma imagem quebrada não chega ao GHCR.
      - name: Smoke test
        run: bash .github/scripts/smoke-web-image.sh "${{ steps.meta.outputs.image }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: docker push "${{ steps.meta.outputs.image }}"
