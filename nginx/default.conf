# Front do 4Frames na imagem nginx-unprivileged (sem root, porta 8080). A API não passa por aqui: no
# cluster, o Ingress leva /api à API antes de a requisição chegar ao front.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness e readiness do Kubernetes, fora do log de acesso para não gravar uma linha a cada verificação.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos do Vite com hash no nome: nunca mudam, então o cache é de um ano. Um asset inexistente é 404,
    # e não o index.html, que o navegador tentaria executar como JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas da SPA (/login, /my-videos, /jobs/:jobId): o que não é arquivo cai no index.html, e o React
    # Router resolve no navegador. no-cache faz o navegador revalidar, e um deploy novo vale no próximo acesso.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
